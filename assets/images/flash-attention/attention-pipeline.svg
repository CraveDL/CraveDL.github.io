<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">Scaled dot-product attention pipeline</title>
  <desc id="desc">A diagram showing Q and K matrix multiplication, softmax, and multiplication with V.</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f4; }
      .card { fill: #ffffff; stroke: #d9ddd5; stroke-width: 2; }
      .ink { fill: #18212f; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .muted { fill: #5b6678; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .teal { fill: #0f766e; }
      .gold { fill: #a16207; }
      .blue { fill: #1e40af; }
      .line { stroke: #5b6678; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6678"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="420"/>
  <text x="54" y="54" class="ink" font-size="28" font-weight="760">Scaled dot-product attention</text>
  <text x="54" y="86" class="muted" font-size="16">Attention computes scores, normalizes them row-wise, then mixes value vectors.</text>

  <rect x="66" y="140" width="116" height="120" rx="8" class="card"/>
  <text x="108" y="205" class="ink" font-size="28" font-weight="760">Q</text>
  <rect x="96" y="222" width="56" height="10" rx="4" class="teal" opacity="0.82"/>

  <rect x="66" y="282" width="116" height="78" rx="8" class="card"/>
  <text x="108" y="329" class="ink" font-size="26" font-weight="760">K</text>

  <path d="M198 200 H270" class="line"/>
  <path d="M198 322 C230 322, 238 254, 270 232" class="line"/>

  <rect x="288" y="160" width="154" height="94" rx="8" class="card"/>
  <text x="318" y="201" class="ink" font-size="22" font-weight="720">Scores</text>
  <text x="318" y="230" class="muted" font-size="15">S = QK^T</text>

  <path d="M462 207 H534" class="line"/>

  <rect x="552" y="160" width="154" height="94" rx="8" class="card"/>
  <text x="582" y="201" class="ink" font-size="22" font-weight="720">Softmax</text>
  <text x="582" y="230" class="muted" font-size="15">P = softmax(S)</text>

  <rect x="552" y="286" width="154" height="74" rx="8" class="card"/>
  <text x="618" y="332" class="ink" font-size="26" font-weight="760">V</text>

  <path d="M726 207 H798" class="line"/>
  <path d="M726 323 C758 323, 766 255, 798 232" class="line"/>

  <rect x="816" y="160" width="116" height="94" rx="8" class="card"/>
  <text x="858" y="201" class="ink" font-size="24" font-weight="760">O</text>
  <text x="842" y="230" class="muted" font-size="15">P V</text>
</svg>

