<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Online softmax updates normalization statistics per block</title>
  <desc id="desc">A diagram showing block score maxima, row sums, and output updates in online softmax.</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f4; }
      .card { fill: #ffffff; stroke: #d9ddd5; stroke-width: 2; }
      .ink { fill: #18212f; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .muted { fill: #5b6678; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .teal { fill: #0f766e; }
      .gold { fill: #a16207; }
      .blue { fill: #1e40af; }
      .line { stroke: #5b6678; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6678"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="430"/>
  <text x="54" y="54" class="ink" font-size="28" font-weight="760">Online softmax makes tiled attention exact</text>
  <text x="54" y="86" class="muted" font-size="16">FlashAttention keeps running row maxima and row sums so blocks combine into the same result as full softmax.</text>

  <rect x="64" y="144" width="190" height="166" rx="8" class="card"/>
  <text x="94" y="184" class="ink" font-size="22" font-weight="740">Current block</text>
  <text x="94" y="218" class="muted" font-size="15">S_ij = Q_i K_j^T</text>
  <rect x="96" y="244" width="34" height="34" rx="5" class="teal"/><rect x="138" y="244" width="34" height="34" rx="5" class="teal" opacity="0.75"/><rect x="180" y="244" width="34" height="34" rx="5" class="teal" opacity="0.55"/>

  <path d="M270 228 H346" class="line"/>

  <rect x="364" y="128" width="252" height="198" rx="8" class="card"/>
  <text x="394" y="168" class="ink" font-size="22" font-weight="740">Update statistics</text>
  <text x="394" y="206" class="muted" font-size="15">m_new = max(m_old, rowmax)</text>
  <text x="394" y="238" class="muted" font-size="15">l_new = rescaled old sum + block sum</text>
  <text x="394" y="270" class="muted" font-size="15">O_new = normalized weighted update</text>
  <circle cx="566" cy="164" r="18" class="gold"/>
  <circle cx="566" cy="226" r="18" class="blue"/>
  <circle cx="566" cy="288" r="18" class="teal"/>

  <path d="M632 228 H708" class="line"/>

  <rect x="726" y="144" width="190" height="166" rx="8" class="card"/>
  <text x="756" y="184" class="ink" font-size="22" font-weight="740">Running output</text>
  <text x="756" y="218" class="muted" font-size="15">O_i, m_i, l_i</text>
  <rect x="758" y="244" width="120" height="22" rx="5" class="teal" opacity="0.85"/>
  <rect x="758" y="276" width="82" height="22" rx="5" class="gold" opacity="0.85"/>
</svg>

