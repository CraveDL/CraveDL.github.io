<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Token embedding plus positional encoding</title>
  <desc id="desc">A diagram showing token embeddings and positional encodings added together before entering a Transformer.</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f4; }
      .card { fill: #ffffff; stroke: #d9ddd5; stroke-width: 2; }
      .ink { fill: #18212f; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .muted { fill: #5b6678; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .accent { fill: #0f766e; }
      .warm { fill: #a16207; }
      .line { stroke: #5b6678; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .plus { fill: #ffffff; stroke: #0f766e; stroke-width: 3; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6678"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="360"/>
  <text x="54" y="54" class="ink" font-size="28" font-weight="760">Why Transformers need positional signals</text>
  <text x="54" y="86" class="muted" font-size="16">Self-attention is permutation-invariant unless position is injected into the representation.</text>

  <rect x="54" y="126" width="210" height="150" rx="8" class="card"/>
  <text x="84" y="164" class="ink" font-size="20" font-weight="720">Token embedding</text>
  <text x="84" y="198" class="muted" font-size="15">meaning of each token</text>
  <rect x="84" y="220" width="36" height="18" rx="4" class="accent"/>
  <rect x="128" y="220" width="36" height="18" rx="4" class="accent" opacity="0.8"/>
  <rect x="172" y="220" width="36" height="18" rx="4" class="accent" opacity="0.6"/>

  <circle cx="320" cy="201" r="23" class="plus"/>
  <text x="311" y="209" class="accent" font-size="28" font-weight="760">+</text>

  <rect x="376" y="126" width="230" height="150" rx="8" class="card"/>
  <text x="406" y="164" class="ink" font-size="20" font-weight="720">Position encoding</text>
  <text x="406" y="198" class="muted" font-size="15">where the token appears</text>
  <path d="M408 234 C430 200, 452 268, 474 234 S518 200, 540 234" stroke="#a16207" stroke-width="4" fill="none"/>
  <circle cx="416" cy="234" r="4" class="warm"/>
  <circle cx="474" cy="234" r="4" class="warm"/>
  <circle cx="532" cy="234" r="4" class="warm"/>

  <path d="M628 201 H702" class="line"/>

  <rect x="724" y="126" width="202" height="150" rx="8" class="card"/>
  <text x="754" y="164" class="ink" font-size="20" font-weight="720">Transformer input</text>
  <text x="754" y="198" class="muted" font-size="15">meaning + order</text>
  <rect x="756" y="224" width="112" height="18" rx="4" fill="#0f766e" opacity="0.88"/>
  <rect x="756" y="248" width="84" height="18" rx="4" fill="#a16207" opacity="0.78"/>
</svg>

