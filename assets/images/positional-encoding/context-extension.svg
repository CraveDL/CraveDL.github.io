<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">Context length extrapolation methods</title>
  <desc id="desc">A diagram comparing direct extrapolation, position interpolation, and NTK-aware scaled RoPE.</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f4; }
      .card { fill: #ffffff; stroke: #d9ddd5; stroke-width: 2; }
      .ink { fill: #18212f; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .muted { fill: #5b6678; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .bad { fill: #b91c1c; }
      .teal { fill: #0f766e; }
      .blue { fill: #1e40af; }
      .gold { fill: #a16207; }
      .line { stroke: #5b6678; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6678"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="420"/>
  <text x="54" y="54" class="ink" font-size="28" font-weight="760">Extending context length is not just "use more positions"</text>
  <text x="54" y="86" class="muted" font-size="16">RoPE can compute positions beyond training length, but model quality can still collapse.</text>

  <rect x="54" y="132" width="250" height="210" rx="8" class="card"/>
  <text x="82" y="168" class="ink" font-size="20" font-weight="720">Direct extrapolation</text>
  <rect x="84" y="212" width="88" height="22" rx="5" class="teal"/>
  <rect x="174" y="212" width="88" height="22" rx="5" class="bad" opacity="0.9"/>
  <text x="86" y="262" class="muted" font-size="14">trained range</text>
  <text x="176" y="262" class="muted" font-size="14">unseen range</text>
  <text x="84" y="300" class="bad" font-size="15" font-weight="720">PPL may spike</text>

  <rect x="364" y="132" width="250" height="210" rx="8" class="card"/>
  <text x="392" y="168" class="ink" font-size="20" font-weight="720">Position interpolation</text>
  <rect x="394" y="212" width="172" height="22" rx="5" class="blue" opacity="0.85"/>
  <path d="M394 250 C430 224, 530 224, 566 250" class="line"/>
  <text x="394" y="292" class="muted" font-size="14">compress longer positions</text>
  <text x="394" y="316" class="muted" font-size="14">into trained range</text>

  <rect x="674" y="132" width="250" height="210" rx="8" class="card"/>
  <text x="702" y="168" class="ink" font-size="20" font-weight="720">NTK-aware scaling</text>
  <rect x="704" y="212" width="56" height="22" rx="5" class="gold"/>
  <rect x="768" y="212" width="56" height="22" rx="5" class="teal"/>
  <rect x="832" y="212" width="56" height="22" rx="5" class="blue"/>
  <text x="704" y="274" class="muted" font-size="14">high frequency:</text>
  <text x="704" y="298" class="muted" font-size="14">keep local resolution</text>
  <text x="704" y="322" class="muted" font-size="14">low frequency: interpolate</text>
</svg>

