<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">Sinusoidal positional encoding waves</title>
  <desc id="desc">Sinusoidal position encoding represented as multiple sine waves with different frequencies.</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f4; }
      .ink { fill: #18212f; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .muted { fill: #5b6678; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .axis { stroke: #d9ddd5; stroke-width: 2; }
      .wave1 { stroke: #0f766e; stroke-width: 4; fill: none; }
      .wave2 { stroke: #1e40af; stroke-width: 4; fill: none; }
      .wave3 { stroke: #a16207; stroke-width: 4; fill: none; }
      .grid { stroke: #d9ddd5; stroke-width: 1; opacity: 0.75; }
    </style>
  </defs>
  <rect class="bg" width="980" height="420"/>
  <text x="54" y="54" class="ink" font-size="28" font-weight="760">Sinusoidal encodings use many frequencies</text>
  <text x="54" y="86" class="muted" font-size="16">Different dimensions oscillate at different rates, giving each position a structured signature.</text>
  <g transform="translate(78,136)">
    <line x1="0" y1="120" x2="820" y2="120" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="240" class="axis"/>
    <g>
      <line x1="120" y1="0" x2="120" y2="240" class="grid"/>
      <line x1="240" y1="0" x2="240" y2="240" class="grid"/>
      <line x1="360" y1="0" x2="360" y2="240" class="grid"/>
      <line x1="480" y1="0" x2="480" y2="240" class="grid"/>
      <line x1="600" y1="0" x2="600" y2="240" class="grid"/>
      <line x1="720" y1="0" x2="720" y2="240" class="grid"/>
    </g>
    <path class="wave1" d="M0 120 C50 30, 100 30, 150 120 S250 210, 300 120 S400 30, 450 120 S550 210, 600 120 S700 30, 750 120 S850 210, 900 120"/>
    <path class="wave2" d="M0 120 C100 48, 200 48, 300 120 S500 192, 600 120 S800 48, 900 120"/>
    <path class="wave3" d="M0 120 C180 70, 360 70, 540 120 S900 170, 980 120"/>
    <text x="0" y="278" class="muted" font-size="14">position</text>
    <text x="-22" y="-10" class="muted" font-size="14">value</text>
  </g>
  <text x="706" y="322" class="ink" font-size="15">high frequency</text>
  <rect x="674" y="310" width="18" height="6" fill="#0f766e"/>
  <text x="706" y="350" class="ink" font-size="15">medium frequency</text>
  <rect x="674" y="338" width="18" height="6" fill="#1e40af"/>
  <text x="706" y="378" class="ink" font-size="15">low frequency</text>
  <rect x="674" y="366" width="18" height="6" fill="#a16207"/>
</svg>

