<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">RoPE rotates query and key vectors by position</title>
  <desc id="desc">A diagram showing rotary position embedding as rotations in two-dimensional subspaces.</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f4; }
      .card { fill: #ffffff; stroke: #d9ddd5; stroke-width: 2; }
      .ink { fill: #18212f; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .muted { fill: #5b6678; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .axis { stroke: #d9ddd5; stroke-width: 2; }
      .q { stroke: #0f766e; stroke-width: 4; marker-end: url(#arrowQ); }
      .k { stroke: #a16207; stroke-width: 4; marker-end: url(#arrowK); }
      .arc { stroke: #5b6678; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    </style>
    <marker id="arrowQ" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a16207"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="430"/>
  <text x="54" y="54" class="ink" font-size="28" font-weight="760">RoPE encodes position as rotation</text>
  <text x="54" y="86" class="muted" font-size="16">Each pair of dimensions is rotated by an angle determined by token position.</text>

  <rect x="68" y="122" width="370" height="250" rx="8" class="card"/>
  <text x="98" y="160" class="ink" font-size="20" font-weight="720">Position m</text>
  <g transform="translate(250,250)">
    <line x1="-120" y1="0" x2="120" y2="0" class="axis"/>
    <line x1="0" y1="100" x2="0" y2="-110" class="axis"/>
    <line x1="0" y1="0" x2="84" y2="-52" class="q"/>
    <path d="M44 -4 A46 46 0 0 1 35 -30" class="arc"/>
    <text x="50" y="-70" class="ink" font-size="15">q rotated by m theta</text>
  </g>

  <rect x="542" y="122" width="370" height="250" rx="8" class="card"/>
  <text x="572" y="160" class="ink" font-size="20" font-weight="720">Position n</text>
  <g transform="translate(724,250)">
    <line x1="-120" y1="0" x2="120" y2="0" class="axis"/>
    <line x1="0" y1="100" x2="0" y2="-110" class="axis"/>
    <line x1="0" y1="0" x2="52" y2="-86" class="k"/>
    <path d="M44 -4 A54 54 0 0 1 24 -48" class="arc"/>
    <text x="42" y="-96" class="ink" font-size="15">k rotated by n theta</text>
  </g>

  <text x="284" y="405" class="muted" font-size="16">The dot product depends on relative phase: n - m.</text>
</svg>

