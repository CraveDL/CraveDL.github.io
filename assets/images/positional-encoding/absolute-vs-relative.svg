<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc">
  <title id="title">Absolute versus relative positional encoding</title>
  <desc id="desc">A diagram contrasting absolute position vectors with relative distance-aware attention bias.</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f4; }
      .card { fill: #ffffff; stroke: #d9ddd5; stroke-width: 2; }
      .ink { fill: #18212f; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .muted { fill: #5b6678; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .teal { fill: #0f766e; }
      .gold { fill: #a16207; }
      .line { stroke: #5b6678; stroke-width: 2; fill: none; }
      .dash { stroke: #a16207; stroke-width: 2; stroke-dasharray: 6 6; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="980" height="390"/>
  <text x="54" y="54" class="ink" font-size="28" font-weight="760">Two ways to inject order</text>
  <text x="54" y="86" class="muted" font-size="16">Absolute encodings label positions; relative encodings modify how tokens attend to each other.</text>

  <rect x="54" y="126" width="404" height="210" rx="8" class="card"/>
  <text x="84" y="164" class="ink" font-size="22" font-weight="740">Absolute positional encoding</text>
  <text x="84" y="194" class="muted" font-size="15">Add a position vector to each token vector.</text>
  <g transform="translate(86,228)">
    <rect width="50" height="46" rx="6" class="teal"/>
    <rect x="68" width="50" height="46" rx="6" class="teal" opacity="0.85"/>
    <rect x="136" width="50" height="46" rx="6" class="teal" opacity="0.7"/>
    <rect x="204" width="50" height="46" rx="6" class="teal" opacity="0.55"/>
    <text x="17" y="29" fill="#fff" font-size="16" font-family="Inter, sans-serif">0</text>
    <text x="85" y="29" fill="#fff" font-size="16" font-family="Inter, sans-serif">1</text>
    <text x="153" y="29" fill="#fff" font-size="16" font-family="Inter, sans-serif">2</text>
    <text x="221" y="29" fill="#fff" font-size="16" font-family="Inter, sans-serif">3</text>
  </g>

  <rect x="522" y="126" width="404" height="210" rx="8" class="card"/>
  <text x="552" y="164" class="ink" font-size="22" font-weight="740">Relative positional encoding</text>
  <text x="552" y="194" class="muted" font-size="15">Attention depends on distance: j - i.</text>
  <g transform="translate(558,232)">
    <circle cx="0" cy="0" r="18" class="gold"/>
    <circle cx="84" cy="0" r="18" class="gold" opacity="0.85"/>
    <circle cx="168" cy="0" r="18" class="gold" opacity="0.7"/>
    <circle cx="252" cy="0" r="18" class="gold" opacity="0.55"/>
    <path d="M0 -30 C60 -86, 130 -86, 168 -30" class="dash"/>
    <path d="M84 30 C132 76, 210 76, 252 30" class="dash"/>
    <text x="-8" y="6" fill="#fff" font-size="14" font-family="Inter, sans-serif">i</text>
    <text x="160" y="6" fill="#fff" font-size="14" font-family="Inter, sans-serif">j</text>
    <text x="70" y="-86" class="muted" font-size="14">distance = j - i</text>
  </g>
</svg>

